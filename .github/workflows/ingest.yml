name: Ingest recent events

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ingest recent events
        run: node ingestion/ingest.js
        env:
          PROJECT1_SUPABASE_URL: ${{ secrets.PROJECT1_SUPABASE_URL }}
          PROJECT1_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT1_SUPABASE_SERVICE_KEY }}
          PROJECT5_SUPABASE_URL: ${{ secrets.PROJECT5_SUPABASE_URL }}
          PROJECT5_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT5_SUPABASE_SERVICE_KEY }}
          PROJECT7_SUPABASE_URL: ${{ secrets.PROJECT7_SUPABASE_URL }}
          PROJECT7_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT7_SUPABASE_SERVICE_KEY }}

      - name: Check source degradation
        if: ${{ always() }}
        run: node api/check-degradation.js
        env:
          PROJECT7_SUPABASE_URL: ${{ secrets.PROJECT7_SUPABASE_URL }}
          PROJECT7_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT7_SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Detect anomalies
        run: node detection/detect.js
        env:
          PROJECT7_SUPABASE_URL: ${{ secrets.PROJECT7_SUPABASE_URL }}
          PROJECT7_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT7_SUPABASE_SERVICE_KEY }}

      - name: Correlate incidents
        run: node detection/correlate.js
        env:
          PROJECT7_SUPABASE_URL: ${{ secrets.PROJECT7_SUPABASE_URL }}
          PROJECT7_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT7_SUPABASE_SERVICE_KEY }}

      - name: Summarize incidents
        run: node summarization/summarize.js
        env:
          PROJECT7_SUPABASE_URL: ${{ secrets.PROJECT7_SUPABASE_URL }}
          PROJECT7_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT7_SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Alert and create tickets
        run: node api/alert-and-ticket.js
        env:
          PROJECT7_SUPABASE_URL: ${{ secrets.PROJECT7_SUPABASE_URL }}
          PROJECT7_SUPABASE_SERVICE_KEY: ${{ secrets.PROJECT7_SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}